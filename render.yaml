services:
  - type: web
    name: medlens-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
    disk:
      name: medlens-data
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1
